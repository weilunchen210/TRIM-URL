services:
  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3000
    depends_on:
      - api
    ports:
      - "5173:80"

  api:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      MONGODB_URL: mongodb://mongo:27017/trimurl
    depends_on:
      - mongo
    ports:
      - "3000:3000"

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
