services:
  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"

  api:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://trimurl:trimurl@postgres:5432/trimurl
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: trimurl
      POSTGRES_PASSWORD: trimurl
      POSTGRES_DB: trimurl
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trimurl -d trimurl"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
